name: Build Android APK

on:
  push:
    branches: [ main, dev ]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    name: Build Android APK
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'

      - name: Install Dependencies
        run: npm install

      - name: Build Web App
        run: npm run build
        env:
          VITE_SUPABASE_URL: ${{ secrets.VITE_SUPABASE_URL }}
          VITE_SUPABASE_ANON_KEY: ${{ secrets.VITE_SUPABASE_ANON_KEY }}

      - name: Setup Java JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '21'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Configure Android SDK Path & Licenses
        run: |
          echo "sdk.dir=$ANDROID_HOME" > android/local.properties
          yes | $ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager --licenses 2>/dev/null || true
          $ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager "platforms;android-36" >/dev/null 2>&1 || true

      - name: Make Gradle Wrapper Executable
        run: chmod +x android/gradlew

      - name: Sync Web Assets to Android
        run: |
          mkdir -p android/app/src/main/assets/public
          cp -r dist/* android/app/src/main/assets/public/
          cp capacitor.config.json android/app/src/main/assets/capacitor.config.json

      - name: Ensure Release Keystore Exists
        run: |
          if [ ! -f android/app/nitip-nyaak.keystore ]; then
            keytool -genkeypair -v \
              -keystore android/app/nitip-nyaak.keystore \
              -alias nitipnyaak \
              -keyalg RSA \
              -keysize 2048 \
              -validity 10000 \
              -storepass nitipnyaak123 \
              -keypass nitipnyaak123 \
              -dname "CN=Nitip Nyaak, OU=Mobile App, O=Nitip Nyaak Community, L=Jakarta, ST=DKI Jakarta, C=ID"
          fi

      - name: Persist Keystore to Repository
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          if git status --porcelain android/app/nitip-nyaak.keystore | grep -q nitip-nyaak.keystore; then
            git add android/app/nitip-nyaak.keystore
            git commit -m "chore: save release signing keystore [skip ci]"
            git push origin HEAD:${{ github.ref_name }} || true
          fi

      - name: Compile Android APK (Release Mode)
        run: |
          cd android
          ./gradlew assembleRelease --no-daemon

      - name: Upload APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: NitipNyaak-Android-APK
          path: android/app/build/outputs/apk/**/*.apk
          if-no-files-found: error
          retention-days: 30

      - name: Prepare Direct APK
        run: |
          mkdir -p release-apk
          cp android/app/build/outputs/apk/release/*.apk release-apk/nitip-nyaak.apk

      - name: Publish Direct APK to GitHub Release
        if: github.ref == 'refs/heads/main'
        uses: softprops/action-gh-release@v2
        with:
          tag_name: latest
          name: "Nitip Nyaak! Direct APK (Latest)"
          body: "Direct APK download link untuk Android. Otomatis diperbarui setiap ada rilis di branch main."
          files: release-apk/nitip-nyaak.apk
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
